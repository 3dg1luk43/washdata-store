name: Deploy store to GitHub Pages

# Stamps every local asset with the deploy timestamp (cache-bust), rebuilds the static
# search index, and publishes the store to GitHub Pages.
#
# Runs on every push to main AND once a day. The daily run exists only for
# search-index.json: it is a snapshot of the catalog, so it goes stale as people contribute,
# and it is not committed to the repo (~300 KB of daily churn for nothing). Publishing it
# from here keeps it out of git history entirely.
#
# Daily is deliberate, not a placeholder. One rebuild reads the whole catalog once (~2.4k
# document reads, ~5% of the Firestore Spark free-tier budget of 50k/day); hourly would be
# ~58k/day and blow the budget on its own. It does not need to be more often: the client
# fetches everything created after the index's `generatedAt` as a small live delta, so new
# contributions are searchable immediately regardless of when this last ran. See
# scripts/build_search_index.mjs.
#
# NB: GitHub disables scheduled workflows in a repo with no commit activity for 60 days.
#
# ONE-TIME SETUP: in the repo, Settings -> Pages -> Build and deployment -> Source,
# choose "GitHub Actions" (instead of "Deploy from a branch"). Otherwise this workflow
# runs but Pages keeps serving the branch directly.

on:
  push:
    branches: [main]
  schedule:
    # 03:17 UTC. Off the top of the hour on purpose: GitHub queues scheduled jobs and
    # delays the congested :00 slots the most.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stamp assets with the deploy timestamp
        run: ASSET_VERSION="$(date -u +%Y%m%d%H%M%S)" node scripts/stamp_assets.mjs

      # Never fatal: a Firestore hiccup must not block a site deploy. Without the file the
      # client falls back to live prefix queries, which is what it did before the index
      # existed - degraded search, not a broken site.
      - name: Build the static search index
        continue-on-error: true
        run: node scripts/build_search_index.mjs

      - name: Assemble the static site into dist/
        run: |
          mkdir -p dist/lib dist/img
          cp index.html admin.html connect.html create.html docs.html changelog.html \
             app.js admin.js editors.js connect.js create.js washstore.js firestore-rest.js site-config.js config.js \
             styles.css README.md CHANGELOG.md dist/
          cp lib/ids.js lib/trace.js lib/merge_guard.js dist/lib/
          cp img/icon.png dist/img/ 2>/dev/null || true
          cp search-index.json dist/ 2>/dev/null || echo "no search index - search falls back to live prefix queries"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
